<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1600" height="650" fill="url(#sky)" />
  <circle cx="800" cy="500" r="140" fill="#fef08a" opacity="0.9" filter="drop-shadow(0 0 60px #f97316)" />
  
  <!-- Ocean -->
  <rect y="600" width="1600" height="400" fill="url(#ocean)" />
  <ellipse cx="800" cy="610" rx="300" ry="12" fill="#fde047" opacity="0.6" />
  
  <!-- Sand Shoreline -->
  <path d="M 0 760 Q 400 700 800 750 T 1600 720 L 1600 1000 L 0 1000 Z" fill="url(#sand)" />
  
  <!-- Palm Trees -->
  <path d="M 200 900 Q 240 600 360 420" stroke="#78350f" stroke-width="26" fill="none" stroke-linecap="round" />
  <!-- Fronds -->
  <path d="M 360 420 Q 260 380 180 440" stroke="#15803d" stroke-width="18" fill="none" stroke-linecap="round" />
  <path d="M 360 420 Q 300 320 220 340" stroke="#16a34a" stroke-width="18" fill="none" stroke-linecap="round" />
  <path d="M 360 420 Q 420 300 500 350" stroke="#15803d" stroke-width="18" fill="none" stroke-linecap="round" />
  <path d="M 360 420 Q 480 390 540 460" stroke="#16a34a" stroke-width="18" fill="none" stroke-linecap="round" />
</svg>
