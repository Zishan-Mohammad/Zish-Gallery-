<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="auroraSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#091e3a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="auroraBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#auroraSky)" />
  <!-- Aurora wave -->
  <path d="M 0 350 Q 400 100 800 280 T 1600 150 L 1600 450 Q 1200 300 800 480 T 0 350 Z" fill="url(#auroraBeam)" filter="blur(24px)" />
  
  <!-- Mountains -->
  <polygon points="100,750 450,380 750,750" fill="#0f172a" />
  <polygon points="450,380 520,460 450,490 380,470" fill="#f8fafc" opacity="0.9" />
  
  <polygon points="600,750 950,320 1300,750" fill="#1e293b" />
  <polygon points="950,320 1040,430 950,460 860,430" fill="#f8fafc" opacity="0.95" />
  
  <polygon points="1100,750 1350,420 1600,750" fill="#0f172a" />
  <!-- Lake Reflection -->
  <rect y="750" width="1600" height="250" fill="#030712" />
  <ellipse cx="950" cy="850" rx="300" ry="20" fill="#10b981" opacity="0.25" filter="blur(16px)" />
</svg>
